        <script src="view/star.js"></script>
        <script src="view/space.js"></script>
        <script>
            (function(){
                var panels=document.querySelectorAll('.panel');
                var btns=document.querySelectorAll('.nav-btn');
                var currentIndex=0;
                var isAnimating=false;
                function switchPanel(index){
                    if(isAnimating||index===currentIndex||index<0||index>=panels.length)return;
                    isAnimating=true;
                    var oldPanel=panels[currentIndex];
                    var newPanel=panels[index];
                    oldPanel.classList.remove('active');
                    oldPanel.classList.add('leave-flip');
                    newPanel.classList.add('enter-flip');
                    btns.forEach(function(btn,i){
                        if(i===index){btn.classList.add('active');}
                        else{btn.classList.remove('active');}
                    });
                    currentIndex=index;
                    setTimeout(function(){
                        oldPanel.classList.remove('leave-flip');
                        newPanel.classList.remove('enter-flip');
                        newPanel.classList.add('active');
                        isAnimating=false;
                    },900);
                }
                btns.forEach(function(btn){
                    btn.addEventListener('click',function(){
                        switchPanel(parseInt(this.getAttribute('data-index')));
                    });
                });
                var scrollCooldown=false;
                window.addEventListener('wheel',function(e){
                    if(scrollCooldown)return;
                    if(e.deltaY>0){switchPanel(currentIndex+1);}
                    else if(e.deltaY<0){switchPanel(currentIndex-1);}
                    scrollCooldown=true;
                    setTimeout(function(){scrollCooldown=false;},1000);
                },{passive:true});
            })();
        </script>
    </body>
