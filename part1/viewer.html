<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>博客阅读</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        body {
            background-color: purple;
            color: white;
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.8;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        h1 { font-size: 2.4em; border-bottom: 2px solid #66b3ff; padding-bottom: 8px; color: #fff; }
        h2 { font-size: 2em; border-bottom: 2px solid #66b3ff; padding-bottom: 8px; color: #fff; }
        h3 { font-size: 1.7em; border-bottom: 2px solid #66b3ff; padding-bottom: 8px; color: #fff; }
        h4 { font-size: 1.5em; color: #fff; }
        h5 { font-size: 1.4em; color: #fff; }
        h6 { font-size: 1.3em; font-weight: bold; color: #fff; }
        code { background: #1a4d80; padding: 2px 6px; border-radius: 4px; color: #8ecbff; }
        pre { background: #0b2545; padding: 16px; border-radius: 8px; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        blockquote { border-left: 4px solid #66b3ff; margin-left: 0; padding-left: 16px; color: #c3d9f0; }
        a { color: #66ccff; }
        img { max-width: 100%; }
        #back { display: inline-block; margin-bottom: 24px; color: #66ccff; }
        .katex-display { margin: 12px 0; overflow-x: auto; }
    </style>
</head>
<body>
    <a href="index.html" id="back">← 返回</a>
    <div id="content">加载中…</div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        var file = new URLSearchParams(location.search).get('file') || '';
        if (!file) {
            document.getElementById('content').textContent = '未指定要查看的文件';
        } else {
            fetch(file)
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(function (md) {
                    var html = marked.parse(md);
                    document.getElementById('content').innerHTML = html;
                    if (window.renderMathInElement) {
                        renderMathInElement(document.getElementById('content'), {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false }
                            ],
                            throwOnError: false
                        });
                    }
                })
                .catch(function (e) { document.getElementById('content').textContent = '加载失败: ' + e; });
        }
    </script>
</body>
</html>
