<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ACM 算法笔记 · 贪心算法 从认识到提升</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="viewer.css">
</head>
<body>
    <!-- 圆柱内壁代码背景：视角在柱内，代码环缓慢旋转 -->
    <div class="cyliner-bg">
        <div class="cyliner" id="cyliner"></div>
    </div>

    <div class="reader-container">
        <!-- 编辑器窗口标题栏 -->
        <div class="editor-bar">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="file-name">greedy.cpp — ACM NOTES</span>
        </div>
        <a href="../../index.html" id="back">← 返回首页</a>
        <div id="content">加载中…</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        var file=new URLSearchParams(location.search).get('file')||'acm1.md';
        fetch(file)
            .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
            .then(function(md){
                var html=marked.parse(md);
                document.getElementById('content').innerHTML=html;
                if(window.renderMathInElement){
                    renderMathInElement(document.getElementById('content'),{
                        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
                        throwOnError:false
                    });
                }
            })
            .catch(function(e){document.getElementById('content').textContent='加载失败: '+e;});
    </script>
    <script src="code-cylinder.js"></script>
    <script>
        /* 内嵌在首页 iframe 时，返回首页改为通知父页面关闭覆盖层 */
        document.getElementById('back').addEventListener('click', function(e){
            if(window.self !== window.top){
                e.preventDefault();
                window.parent.postMessage({type:'blogClose'}, '*');
            }
        });
    </script>
</body>
</html>
