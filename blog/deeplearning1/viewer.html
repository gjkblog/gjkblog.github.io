<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>深度学习 第二篇：从感知机到神经网络，摸到了反向传播的门口</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="viewer.css">
</head>
<body>
    <!-- 这里是神经网络背景的画布，绝对不能有 space-canvas -->
    <canvas id="synapse-canvas"></canvas>
    
    <div class="reader-container">
        <a href="../../index.html" id="back">← 返回首页</a>
        <div id="content">加载中…</div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        var file=new URLSearchParams(location.search).get('file')||'deeplearning2.md';
        fetch(file)
            .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
            .then(function(md){
                var html=marked.parse(md);
                document.getElementById('content').innerHTML=html;
                if(window.renderMathInElement){
                    renderMathInElement(document.getElementById('content'),{
                        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
                        throwOnError:false
                    });
                }
            })
            .catch(function(e){document.getElementById('content').textContent='加载失败: '+e;});
    </script>
    
    <!-- 只能加载 synapse.js！ -->
    <script src="synapse.js"></script>
</body>
</html>
