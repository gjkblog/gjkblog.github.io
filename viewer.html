<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>博客阅读</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        body{
            background-color: #0a0b1a;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(255, 0, 150, 0.4), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 100, 255, 0.4), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.3), transparent 60%),
                linear-gradient(135deg, #140024 0%, #0a0b1a 100%);
            background-size: 100% 100%;
            background-attachment: fixed;
            color: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .reader-container{
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 820px;
            padding: 45px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), inset 0 1px 3px rgba(255, 255, 255, 0.6);
            line-height: 1.9;
            transition: box-shadow 0.4s ease;
        }
        .reader-container::before{
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: linear-gradient(115deg, rgba(255, 255, 255, 0) 20%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 80%);
            transform: translateX(-100%) skewX(-15deg);
            pointer-events: none;
            animation: glass-sweep 4s infinite ease-in-out;
        }
        @keyframes glass-sweep{
            0%        { transform: translateX(-100%) skewX(-15deg); }
            30%, 100% { transform: translateX(100%) skewX(-15deg); }
        }
        .reader-container:hover{
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 0, 170, 0.3), 0 0 60px rgba(0, 170, 255, 0.2);
        }
        .stars-container{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .reader-container:hover .stars-container{
            opacity: 1;
        }
        .star{
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px #fff;
            opacity: 0;
            animation: particle-burst 1s ease-out forwards;
        }
        .star:nth-child(1){ left: 20%; top: 80%; animation-delay: 0s; background: #ff00aa; box-shadow: 0 0 8px #ff00aa; }
        .star:nth-child(2){ left: 50%; top: 90%; animation-delay: 0.1s; background: #00ffff; box-shadow: 0 0 8px #00ffff; }
        .star:nth-child(3){ left: 80%; top: 70%; animation-delay: 0.05s; background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .star:nth-child(4){ left: 10%; top: 40%; animation-delay: 0.15s; background: #ff00aa; box-shadow: 0 0 8px #ff00aa; }
        .star:nth-child(5){ left: 90%; top: 30%; animation-delay: 0.2s; background: #00ffff; box-shadow: 0 0 8px #00ffff; }
        .star:nth-child(6){ left: 30%; top: 20%; animation-delay: 0.25s; background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .star:nth-child(7){ left: 70%; top: 10%; animation-delay: 0.3s; background: #ff00aa; box-shadow: 0 0 8px #ff00aa; }
        @keyframes particle-burst{
            0%   { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px)) scale(0); }
        }
        h1, h2, h3, h4, h5, h6{
            color: #fff;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        h1{ font-size: 2.2em; border-bottom: 2px solid rgba(255, 255, 255, 0.15); padding-bottom: 10px; }
        h2{ font-size: 1.8em; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; }
        h3{ font-size: 1.5em; color: #ffb3e6; }
        p{ margin-bottom: 1.2em; font-size: 16px; }
        code{
            background: rgba(255, 0, 200, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            color: #ff99ff;
            font-family: Consolas, monospace;
            border: 1px solid rgba(255, 0, 200, 0.3);
        }
        pre{
            background: rgba(13, 0, 26, 0.7);
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }
        pre code{ background: none; padding: 0; color: #e6e6e6; border: none; }
        blockquote{
            border-left: 4px solid #00ffff;
            margin: 1.5em 0;
            padding: 15px 20px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 0 10px 10px 0;
            color: #b3ffff;
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.1);
        }
        a{ color: #00ffff; text-decoration: none; transition: all 0.2s; font-weight: 500; }
        a:hover{ color: #fff; text-shadow: 0 0 10px #00ffff; }
        img{ max-width: 100%; border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); }
        #back{
            display: inline-block;
            margin-bottom: 25px;
            color: #fff;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 2;
            position: relative;
        }
        #back:hover{
            background: rgba(255, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            text-decoration: none;
        }
        .katex-display{ margin: 1.5em 0; overflow-x: auto; overflow-y: hidden; }
    </style>
</head>
<body>
    <div class="reader-container">
        <div class="stars-container">
            <div class="star" style="--x:-150; --y:-100"></div>
            <div class="star" style="--x:150; --y:-120"></div>
            <div class="star" style="--x:180; --y:100"></div>
            <div class="star" style="--x:-120; --y:150"></div>
            <div class="star" style="--x:-200; --y:0"></div>
            <div class="star" style="--x:200; --y:0"></div>
            <div class="star" style="--x:0; --y:-180"></div>
        </div>
        <a href="index.html" id="back">← 返回首页</a>
        <div id="content">加载中…</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        var file = new URLSearchParams(location.search).get('file') || '';
        if (!file) {
            document.getElementById('content').textContent = '未指定要查看的文件';
        } else {
            fetch(file)
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function (md) {
                    var html = marked.parse(md);
                    document.getElementById('content').innerHTML = html;
                    if (window.renderMathInElement) {
                        renderMathInElement(document.getElementById('content'), {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false }
                            ],
                            throwOnError: false
                        });
                    }
                })
                .catch(function (e) {
                    document.getElementById('content').textContent = '加载失败: ' + e;
                });
        }
    </script>
</body>
</html>
